<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo: Mais ou Mas? (Edição TV 65")</title>
    <style>
        /* RESET TOTAL PARA EVITAR SCROLL (ROLAGEM) NA TV */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #e0f7fa; 
            padding: 2vh 2vw; 
            color: #333;
            height: 100vh; /* Trava a altura em exatos 100% da tela */
            max-height: 100vh;
            overflow: hidden; /* Proíbe o surgimento de barra de rolagem */
            display: flex;
            flex-direction: column;
        }

        /* 1. CABEÇALHO (Ocupa ~12% da altura) */
        header {
            height: 12vh;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 0 40px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 2vh;
        }
        h1 { 
            color: #00838f; 
            font-size: 3.5vh; 
            margin: 0;
            text-transform: uppercase;
        }
        .score-board { 
            font-size: 3.5vh; 
            font-weight: bold; 
            color: #d84315; 
            background: #ffccbc;
            padding: 10px 30px;
            border-radius: 15px;
        }

        /* 2. ÁREA DO VÍDEO DO GOOGLE DRIVE (Ocupa ~40% da altura) */
        .video-section {
            height: 40vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 2vh;
        }
        .video-wrapper {
            width: 100%;
            max-width: 800px; /* Largura máxima para não distorcer */
            height: 100%;
            border: 6px solid #00838f;
            border-radius: 20px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }
        /* Iframe limpo, sem máscara! */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 3. PAINÉIS DE JOGO LADO A LADO (Ocupa ~42% da altura) */
        .game-panels {
            height: 42vh;
            display: flex;
            gap: 2vw; /* Espaço entre o painel do aluno e professor */
            width: 100%;
        }

        .panel {
            flex: 1; /* Divide a tela 50/50 na horizontal */
            border-radius: 25px;
            padding: 2vh 2vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        
        /* Área do Aluno (Esquerda) */
        .student-area { 
            background-color: #ffffff; 
            border: 6px dashed #29b6f6; 
        }
        .student-area h2 { color: #00acc1; font-size: 4vh; margin: 0 0 2vh 0; }
        
        /* Área do Professor (Direita) */
        .teacher-area { 
            background-color: #ffffff; 
            border: 6px dashed #ec407a; 
        }
        .teacher-area h2 { color: #d81b60; font-size: 4vh; margin: 0 0 2vh 0; }

        /* BOTÕES GIGANTES PARA A TV */
        .btn-row {
            display: flex;
            gap: 20px;
            justify-content: center;
            width: 100%;
        }
        .btn { 
            font-size: 3.5vh; 
            font-weight: bold;
            padding: 2vh 3vw; 
            cursor: pointer; 
            border: none; 
            border-radius: 20px; 
            color: white; 
            transition: all 0.2s; 
            box-shadow: 0 6px 10px rgba(0,0,0,0.2);
            flex: 1;
            text-transform: uppercase;
        }
        .btn:active { transform: scale(0.95); }
        
        .btn-student { background-color: #29b6f6; height: 12vh;}
        .btn-student.selected { 
            background-color: #ffeb3b; 
            color: #333; 
            box-shadow: 0 0 30px #ffeb3b; 
            border: 5px solid #fbc02d;
            transform: scale(1.05);
        }
        
        .btn-correct { background-color: #66bb6a; height: 12vh;}
        .btn-wrong { background-color: #ef5350; height: 12vh;}
        
        .btn-end { 
            background-color: #455a64; 
            font-size: 2.5vh;
            padding: 1.5vh 3vw;
            margin-top: 2vh;
            width: 80%;
        }
        
        #student-choice { 
            font-size: 3.5vh; 
            font-weight: bold; 
            color: #e65100; 
            margin-top: 2vh;
            min-height: 4vh;
        }

        /* TELA FINAL */
        #game-screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        #final-screen { 
            display: none; 
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: white;
            border-radius: 30px;
            padding: 40px;
            height: 100%;
            border: 10px solid #00838f;
        }
        .winner { font-size: 8vh; color: #f57f17; margin: 30px 0; font-weight: bold;}
    </style>
</head>
<body>

    <!-- TELA PRINCIPAL DO JOGO -->
    <div id="game-screen">
        
        <!-- TOPO -->
        <header>
            <h1>🎵 Jogo: MAIS ou MAS</h1>
            <div class="score-board">
                PONTOS: <span id="score">0</span>
            </div>
        </header>
        
        <!-- MEIO: VÍDEO DO GOOGLE DRIVE -->
        <div class="video-section">
            <div class="video-wrapper">
                <iframe src="https://drive.google.com/file/d/1WjqAufL25kcg26Q_jhDshBnvTpqbXjnX/preview" allow="autoplay; fullscreen"></iframe>
            </div>
        </div>

        <!-- BAIXO: PAINÉIS LADO A LADO -->
        <div class="game-panels">
            
            <!-- PAINEL DO ALUNO -->
            <div class="panel student-area">
                <h2>Área do Aluno</h2>
                <div class="btn-row">
                    <button class="btn btn-student" id="btn-mais" onclick="selectAnswer('MAIS')">MAIS</button>
                    <button class="btn btn-student" id="btn-mas" onclick="selectAnswer('MAS')">MAS</button>
                </div>
                <p id="student-choice"></p>
            </div>
            
            <!-- PAINEL DO PROFESSOR -->
            <div class="panel teacher-area">
                <h2>Área de Correção</h2>
                <div class="btn-row">
                    <button class="btn btn-correct" onclick="judge(true)">ACERTOU! (+1)</button>
                    <button class="btn btn-wrong" onclick="judge(false)">ERROU (0)</button>
                </div>
                <button class="btn btn-end" onclick="endGame()">Encerrar Partida</button>
            </div>

        </div>
    </div>

    <!-- TELA FINAL -->
    <div id="final-screen">
        <h1 style="font-size: 6vh;">Fim de Jogo! 🎉</h1>
        <div class="winner">
            Pontuação Final: <span id="final-score" style="color: #e65100;">0</span>
        </div>
        <button class="btn btn-student" style="padding: 2vh 4vw; font-size: 4vh; margin-top: 3vh;" onclick="location.reload()">Jogar Novamente</button>
    </div>

    <!-- LÓGICA DO JOGO -->
    <script>
        let score = 0;

        function selectAnswer(choice) {
            document.getElementById('btn-mais').classList.remove('selected');
            document.getElementById('btn-mas').classList.remove('selected');
            
            if (choice === 'MAIS') {
                document.getElementById('btn-mais').classList.add('selected');
            } else {
                document.getElementById('btn-mas').classList.add('selected');
            }

            document.getElementById('student-choice').innerText = "Resposta do Aluno: " + choice;
        }

        function judge(isCorrect) {
            if (isCorrect) {
                score++;
                document.getElementById('score').innerText = score;
                // Pisca a tela de pontuação para confirmar o acerto
                document.querySelector('.score-board').style.backgroundColor = "#c8e6c9";
                setTimeout(() => { document.querySelector('.score-board').style.backgroundColor = "#ffccbc"; }, 400);
            } 
            
            // Reseta os botões para a próxima pausa
            document.getElementById('btn-mais').classList.remove('selected');
            document.getElementById('btn-mas').classList.remove('selected');
            document.getElementById('student-choice').innerText = "";
        }

        function endGame() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('final-screen').style.display = 'flex';
            document.getElementById('final-score').innerText = score;
        }
    </script>
</body>
</html>
