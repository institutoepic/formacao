<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo Educativo: Mais vs. Mas</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Montserrat', 'Comic Sans MS', 'Arial', sans-serif;
            background-color: #e0f7fa;
            height: 100vh;
            max-height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* CABEÇALHO (12vh) */
        header {
            height: 12vh;
            background-color: #0288d1;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 3vw;
            box-shadow: 0 0.5vh 1vh rgba(0,0,0,0.15);
            z-index: 10;
        }

        h1 {
            font-size: 4.5vh;
            text-shadow: 0.3vh 0.3vh 0 #01579b;
            letter-spacing: 0.1vw;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 2vw;
        }

        .btn-encerrar {
            font-size: 2.5vh;
            font-weight: bold;
            color: #ffffff;
            background-color: #d32f2f;
            border: 0.4vh solid #b71c1c;
            padding: 1vh 2vw;
            border-radius: 1.5vh;
            cursor: pointer;
            box-shadow: 0 0.5vh 0 #b71c1c;
            transition: all 0.1s ease;
        }

        .btn-encerrar:active {
            transform: translateY(0.4vh);
            box-shadow: 0 0.1vh 0 #b71c1c;
        }

        .placar-container {
            font-size: 4.2vh;
            font-weight: bold;
            background-color: #ffca28;
            color: #212121;
            padding: 1vh 2.5vw;
            border-radius: 2vh;
            border: 0.4vh solid #f57f17;
            box-shadow: 0 0.5vh 0 #f57f17;
            transition: background-color 0.3s ease;
        }

        /* Animação do Placar */
        @keyframes piscar-acerto {
            0%, 100% { background-color: #ffca28; transform: scale(1); }
            50% { background-color: #4caf50; color: white; transform: scale(1.1); }
        }

        .flash-acerto {
            animation: piscar-acerto 0.5s ease 2;
        }

        /* VÍDEO CENTRADO (40vh) */
        .video-section {
            height: 40vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #b2ebf2;
            padding: 1vh 0;
        }

        .video-wrapper {
            height: 38vh;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 2vh;
            overflow: hidden;
            box-shadow: 0 1vh 2vh rgba(0,0,0,0.3);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* PAINÉIS DE JOGO LADO A LADO (42vh) */
        .game-panels {
            height: 42vh;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
            padding: 1.5vh 2vw;
            gap: 2vw;
        }

        .panel {
            flex: 1;
            height: 39vh;
            background-color: #ffffff;
            border-radius: 3vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 2vh 2vw;
            box-shadow: 0 1vh 1.5vh rgba(0,0,0,0.1);
        }

        .panel-title {
            font-size: 3.2vh;
            font-weight: bold;
            margin-bottom: 1vh;
            text-transform: uppercase;
        }

        /* Painel Aluno (Esquerda) */
        .panel-aluno {
            border: 0.8vh dashed #0288d1;
        }
        .panel-aluno .panel-title {
            color: #0288d1;
        }

        /* Painel Professor (Direita) */
        .panel-professor {
            border: 0.8vh dashed #e53935;
        }
        .panel-professor .panel-title {
            color: #e53935;
        }

        .button-row {
            display: flex;
            gap: 2vw;
            width: 100%;
            justify-content: center;
            align-items: center;
            flex: 1;
        }

        /* Estilo dos Botões Gigantes */
        .btn-game {
            font-size: 5vh;
            font-weight: bold;
            padding: 2.5vh 5vw;
            border-radius: 2.5vh;
            cursor: pointer;
            transition: all 0.1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            min-width: 16vw;
            text-shadow: 0.2vh 0.2vh 0 rgba(0,0,0,0.1);
        }

        /* Botões do Aluno */
        .btn-opcao {
            background-color: #e0e0e0;
            color: #424242;
            border: 0.5vh solid #9e9e9e;
            box-shadow: 0 0.8vh 0 #9e9e9e;
        }

        .btn-opcao:active {
            transform: translateY(0.4vh);
            box-shadow: 0 0.4vh 0 #9e9e9e;
        }

        /* Destaque Amarelo para Seleção do Aluno */
        .btn-opcao.selecionado {
            background-color: #fff176 !important;
            color: #212121 !important;
            border: 0.6vh solid #fbc02d !important;
            box-shadow: 0 0.4vh 0 #fbc02d !important;
            transform: translateY(0.4vh);
        }

        /* Botões do Professor */
        .btn-acertou {
            background-color: #4caf50;
            color: white;
            border: 0.5vh solid #388e3c;
            box-shadow: 0 0.8vh 0 #388e3c;
        }

        .btn-acertou:active {
            transform: translateY(0.4vh);
            box-shadow: 0 0.4vh 0 #388e3c;
        }

        .btn-errou {
            background-color: #f44336;
            color: white;
            border: 0.5vh solid #d32f2f;
            box-shadow: 0 0.8vh 0 #d32f2f;
        }

        .btn-errou:active {
            transform: translateY(0.4vh);
            box-shadow: 0 0.4vh 0 #d32f2f;
        }

        /* Feedback de Resposta do Aluno */
        .resposta-feedback {
            font-size: 3vh;
            font-weight: bold;
            color: #333;
            margin-top: 1vh;
            height: 4.5vh;
            text-align: center;
        }

        /* TELA FINAL */
        .tela-final {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0288d1;
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
        }

        .tela-final h2 {
            font-size: 8vh;
            margin-bottom: 3vh;
            text-shadow: 0.4vh 0.4vh 0 #01579b;
        }

        .pontuacao-final {
            font-size: 14vh;
            font-weight: bold;
            background-color: #ffca28;
            color: #212121;
            padding: 3vh 8vw;
            border-radius: 4vh;
            border: 1vh solid #f57f17;
            box-shadow: 0 1.5vh 0 #f57f17;
            margin-bottom: 6vh;
        }

        .btn-reiniciar {
            font-size: 5vh;
            font-weight: bold;
            padding: 3vh 6vw;
            background-color: #4caf50;
            color: white;
            border: 0.6vh solid #388e3c;
            border-radius: 3vh;
            cursor: pointer;
            box-shadow: 0 1vh 0 #388e3c;
            transition: all 0.1s ease;
        }

        .btn-reiniciar:active {
            transform: translateY(0.6vh);
            box-shadow: 0 0.4vh 0 #388e3c;
        }
    </style>
</head>
<body>

    <div id="interface-jogo" style="display: flex; flex-direction: column; height: 100vh;">
        
        <header>
            <h1>Mais vs. Mas</h1>
            <div class="header-controls">
                <button class="btn-encerrar" onclick="encerrarPartida()">Encerrar Partida</button>
                <div class="placar-container" id="placar">Pontos: 0</div>
            </div>
        </header>

        <section class="video-section">
            <div class="video-wrapper">
                <iframe src="https://drive.google.com/file/d/1WjqAufL25kcg26Q_jhDshBnvTpqbXjnX/preview" allow="autoplay"></iframe>
            </div>
        </section>

        <main class="game-panels">
            
            <div class="panel panel-aluno">
                <div class="panel-title">Painel do Aluno</div>
                <div class="button-row">
                    <button class="btn-game btn-opcao" id="btn-mais" onclick="selecionarOpcao('MAIS')">MAIS</button>
                    <button class="btn-game btn-opcao" id="btn-mas" onclick="selecionarOpcao('MAS')">MAS</button>
                </div>
                <div class="resposta-feedback" id="feedback-aluno">Resposta do Aluno: </div>
            </div>

            <div class="panel panel-professor">
                <div class="panel-title">Painel do Professor</div>
                <div class="button-row">
                    <button class="btn-game btn-acertou" onclick="avaliarResposta(true)">ACERTOU! (+1)</button>
                    <button class="btn-game btn-errou" onclick="avaliarResposta(false)">ERROU (0)</button>
                </div>
                <div style="height: 4.5vh;"></div> </div>

        </main>
    </div>

    <div class="tela-final" id="tela-final">
        <h2>Fim de Jogo!</h2>
        <div class="pontuacao-final" id="pontuacao-final">0 Pontos</div>
        <button class="btn-reiniciar" onclick="reiniciarJogo()">Jogar Novamente</button>
    </div>

    <script>
        let pontos = 0;
        let respostaSelecionada = "";

        function selecionarOpcao(opcao) {
            respostaSelecionada = opcao;
            
            // Remove a seleção de ambos os botões
            document.getElementById('btn-mais').classList.remove('selecionado');
            document.getElementById('btn-mas').classList.remove('selecionado');
            
            // Adiciona destaque ao botão clicado
            if (opcao === 'MAIS') {
                document.getElementById('btn-mais').classList.add('selecionado');
            } else if (opcao === 'MAS') {
                document.getElementById('btn-mas').classList.add('selecionado');
            }
            
            // Atualiza o texto de feedback abaixo dos botões do aluno
            document.getElementById('feedback-aluno').innerText = "Resposta do Aluno: " + opcao;
        }

        function avaliarResposta(foiAcerto) {
            const placarElement = document.getElementById('placar');
            
            if (foiAcerto) {
                pontos++;
                placarElement.innerText = "Pontos: " + pontos;
                
                // Força a animação de piscar removendo e reinserindo a classe
                placarElement.classList.remove('flash-acerto');
                void placarElement.offsetWidth; // Truque de reflow para resetar animação CSS
                placarElement.classList.add('flash-acerto');
            }
            
            // Limpa a resposta do aluno para a próxima rodada independentemente de acerto/erro
            respostaSelecionada = "";
            document.getElementById('btn-mais').classList.remove('selecionado');
            document.getElementById('btn-mas').classList.remove('selecionado');
            document.getElementById('feedback-aluno').innerText = "Resposta do Aluno: ";
        }

        function encerrarPartida() {
            // Esconde a interface principal
            document.getElementById('interface-jogo').style.display = 'none';
            
            // Configura e exibe a tela final
            document.getElementById('pontuacao-final').innerText = pontos + (pontos === 1 ? " Ponto" : " Pontos");
            document.getElementById('tela-final').style.display = 'flex';
        }

        function reiniciarJogo() {
            // Recarrega a página do jogo do zero
            location.reload();
        }
    </script>
</body>
</html>
